[package]
name = "proofswap"
version = "0.1.0"
description = "Trustless settlement for CS2 items: the payment is locked on Solana and released by attested Steam inventory state"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "proofswap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
# Same version anchor-lang uses, so AccountInfo types match.
solana-instructions-sysvar = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
